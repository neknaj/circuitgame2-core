[workspace]

[package]
name = "ncg2-rp"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT"
publish = false

[[bin]]
name = "ncg2-rp-uart"
path = "src/uart_demo.rs"
required-features = ["uart"]

[[bin]]
name = "ncg2-rp-i2c"
path = "src/i2c_demo.rs"
required-features = ["i2c"]

[[bin]]
name = "ncg2-rp-spi"
path = "src/spi_demo.rs"
required-features = ["spi"]

[features]
spi = ["dep:embassy-sync", "embassy-rp/unstable-pac"]
i2c = ["dep:embassy-futures", "dep:embassy-sync", "embassy-rp/unstable-pac"]
uart = [
    "dep:embassy-futures",
    "dep:embassy-sync",
    "dep:embedded-io-async",
    "dep:portable-atomic",
    "dep:static_cell",
    "embassy-rp/unstable-pac",
]
pico = ["embassy-rp/rp2040"]
pico2 = ["embassy-rp/rp235xa"]

[dependencies]
circuitgame2-device-timing = { path = "../../crates/device-timing" }
circuitgame2-packed-nor = { path = "../../crates/packed-nor" }
embassy-executor = { version = "=0.10.0", features = ["platform-cortex-m", "executor-thread"] }
embassy-rp = { version = "=0.10.0", features = ["critical-section-impl", "time-driver"] }
embassy-time = "=0.5.1"
embassy-futures = { version = "=0.1.2", optional = true }
embassy-sync = { version = "=0.8.0", optional = true }
embedded-io-async = { version = "=0.7.0", optional = true }
static_cell = { version = "=2.1.1", optional = true }
portable-atomic = { version = "=1.15.0", features = ["critical-section"], optional = true }
cortex-m-rt = "0.7"
panic-halt = "=1.0.0"

[build-dependencies]
circuitgame2-packed-nor = { path = "../../crates/packed-nor" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
